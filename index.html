<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly - Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">☁ Weatherly</div>
        <span class="nav-text">Your Daily Weather Companion</span>
    </header>

    <main class="container">

        <section class="hero">
            <p class="tagline">WEATHER AT YOUR FINGERTIPS</p>
            <h1>Discover the Weather<br>
                <span>Around You.</span>
            </h1>
            <p class="subtitle">
                Get real-time weather updates for any city in the world.
            </p>

            <div class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter your city..."
                >
                <button id="searchBtn">Search</button>
            </div>
        </section>

        <section id="weatherResult" class="weather-result">
            <div class="welcome-card">
                <div class="welcome-icon">🌤️</div>
                <h2>Welcome to Weatherly</h2>
                <p>Search for a city to discover its current weather.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Made By Harshit Rawat | Weatherly © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
